[project]
name = "mqt-predictor-understanding"
version = "0.1.0"
description = "Reproducible experiments for understanding MQT Predictor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mqt.predictor==2.4.0",
    # Compatibility pins from the official MQT Predictor v2.4.0 release lock.
    "mqt.bench==2.2.3",
    "qiskit==2.5.0",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.47.0",
    "qiskit-qasm3-import==0.6.0",
    "pytket==2.18.1",
    "pytket-qiskit==0.77.0",
    "bqskit==1.2.1",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
    "sb3-contrib==2.9.0",
    "stable-baselines3==2.9.0",
    "gymnasium==1.3.0",
    "torch==2.13.0",
    "joblib==1.5.3",
    "tensorboard==2.21.0",
]

[tool.uv]
package = false
